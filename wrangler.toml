name = "flatbush-transportation"
main = "worker/index.js"
compatibility_date = "2026-08-17"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "flatbush-transportation"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PRIVATE_UPLOADS"
bucket_name = "flatbush-private-uploads"

[vars]
FROM_EMAIL = "Flatbush Transportation <forms@flatbushtransportation.com>"
